<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mis Finanzas">
<meta name="theme-color" content="#f5f5f4">
<title>Mis Finanzas</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f5f5f4;--card:#fff;--ink:#111;--mut:#777;--line:#e6e6e4;--ok:#1f9d55;--warn:#e8840c;--bad:#d64545;--blue:#2f6fd6}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,Roboto,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
header{position:sticky;top:0;z-index:20;background:var(--bg);padding:22px 16px 12px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:19px;font-weight:800;letter-spacing:1px}
header small{display:block;font-size:11px;color:var(--mut);font-weight:600}
main{padding:0 14px 80px}
nav{position:fixed;bottom:0;left:0;right:0;height:62px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:20}
nav button{flex:1;border:0;background:none;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav button svg{width:22px;height:22px}
nav button.on{color:#111;font-weight:700}
.block{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.block h3{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.row:last-child{border-bottom:0}
.row span:last-child{text-align:right}
.tap{cursor:pointer}
.big{font-size:22px;font-weight:800}
.pos{color:var(--ok)}.neg{color:var(--bad)}.wrn{color:var(--warn)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.metric{background:#f3f3f1;border-radius:10px;padding:10px}
.metric .l{font-size:12px;color:var(--mut)}
.metric .v{font-size:19px;font-weight:800;margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:2px 0 10px}
.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:18px;padding:7px 12px;font-size:13px;color:#111}
.chip.on{background:#111;color:#fff;border-color:#111}
.bar{height:8px;background:#ececea;border-radius:6px;overflow:hidden;margin:4px 0 8px}
.bar i{display:block;height:100%;background:var(--blue)}
.s{font-size:12px;color:var(--mut);margin-top:2px}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{border:0;border-radius:10px;padding:12px 14px;font-size:14px;font-weight:700;background:#111;color:#fff;width:100%}
.btn.sec{background:#fff;color:#111;border:1px solid #111}
.btn.ghost{background:#e9e9e7;color:#111}
.btn.green{background:#e3f6ea;color:#16794a}
.btn.danger{background:#fff;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:9px 10px;font-size:13px}
.mt{margin-top:10px}
.empty{text-align:center;color:var(--mut);padding:24px 10px;font-size:14px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 14px 24px}
.sheet .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.sheet .top h2{font-size:18px}
.x{border:0;background:#e9e9e7;border-radius:50%;width:36px;height:36px;font-size:16px;color:#111;flex-shrink:0}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px;font-weight:600}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;color:#111;font-family:inherit}
textarea{min-height:60px}
.pick{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-top:10px;font-size:14px}
.pick input{width:22px;height:22px;flex-shrink:0}
.mini{border:0;background:#f0f0ef;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;color:#111}
.back{border:0;background:none;font-size:14px;font-weight:700;color:#111;padding:4px 0 12px}
.aviso{border-radius:10px;padding:9px 11px;font-size:13px;margin-bottom:8px;background:#fff2e0;color:#8a4b00}
.aviso.bad{background:#fde8e8;color:#9b1c1c}.aviso.ok{background:#e3f6ea;color:#16794a}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.item:last-child{border-bottom:0}
.item .t{font-weight:600;font-size:14px}
.calc{font-size:26px;font-weight:800;text-align:center;padding:8px 0}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px;background:#eee;color:#444;margin-left:4px}
#toast{position:fixed;top:0;left:0;right:0;z-index:100;padding:7px 12px;font-size:12px;font-weight:700;color:#fff;text-align:center;transform:translateY(-100%);transition:transform .12s;pointer-events:none}
#toast.show{transform:translateY(0)}
#toast.ok{background:var(--ok)}#toast.warn{background:var(--warn)}
.ovc{align-items:center}
.cbox{background:#fff;border-radius:16px;padding:18px;width:86%;max-width:360px}
.cbox p{font-size:17px;font-weight:800;margin-bottom:6px}
.cbox .sub{font-size:13px;color:var(--mut);margin-bottom:14px}
</style>
</head>
<body>
<div id="toast"></div>
<header><div><h1>MIS FINANZAS</h1><small id="hsub"></small></div></header>
<main id="view"></main>
<nav id="nav"></nav>
<div id="modals"></div>
<script>
/* ===================== UTILIDADES ===================== */
const KEY = 'fp_v1';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n = v => { const x = parseFloat(String(v ?? '').replace(',', '.')); return isNaN(x) ? 0 : x; };
const r2 = v => Math.round(n(v) * 100) / 100;
const fmt = v => r2(v).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
const SIM = {USD:'$', PEN:'S/'};
const M = (v, mon = 'USD') => SIM[mon] + ' ' + fmt(v);
const pad = x => String(x).padStart(2, '0');
const fstr = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const hoy = () => fstr(new Date());
const mesDe = f => String(f || '').slice(0, 7);
const mesHoy = () => hoy().slice(0, 7);
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const nomMes = m => { const [y, mo] = m.split('-'); return MESES[+mo - 1] + ' ' + y; };
const Mcap = m => { const s = nomMes(m); return s[0].toUpperCase() + s.slice(1); };
const sumMes = (m, k) => { let [y, mo] = m.split('-').map(Number); mo += k; while (mo > 12) { mo -= 12; y++; } while (mo < 1) { mo += 12; y--; } return y + '-' + pad(mo); };
const fcorta = f => f ? f.slice(8, 10) + '/' + f.slice(5, 7) + '/' + f.slice(0, 4) : '';
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const fLarga = f => { const d = new Date(f + 'T12:00:00'); return DIAS[d.getDay()] + ' ' + f.slice(8, 10) + '/' + f.slice(5, 7); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const sum = (a, f) => a.reduce((s, x) => s + n(f(x)), 0);
const row = (a, b, attrs = '') => `<div class="row" ${attrs}><span>${a}</span><span>${b}</span></div>`;
const bar = (pct, color) => `<div class="bar"><i style="width:${Math.max(0, Math.min(100, pct))}%;${color ? 'background:' + color : ''}"></i></div>`;
const diasEntre = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
const fechaDia = (m, dia) => { const [y, mo] = m.split('-').map(Number), dim = new Date(y, mo, 0).getDate(); return m + '-' + pad(Math.min(Math.max(1, Math.round(n(dia)) || 1), dim)); };

/* ===================== DATOS ===================== */
const GRUPOS = {nec:'Necesidad', gus:'Gusto', deu:'Deuda', neg:'Negocio', x:'No cuenta en la regla'};
const DEF = () => ({
  v:1, ultCopia:0,
  cfg:{tc:3.75, regla:'50/30/20', pcts:null, pago:{monto:0, freq:'biweekly'}, otros:0},
  cats:{
    gasto:[{n:'Comida',g:'nec'},{n:'Transporte',g:'nec'},{n:'Renta/Casa',g:'nec'},{n:'Servicios',g:'nec'},{n:'Salud',g:'nec'},{n:'Familia',g:'nec'},{n:'Envíos a Perú',g:'nec'},{n:'Comisiones',g:'nec'},{n:'Salidas',g:'gus'},{n:'Ropa',g:'gus'},{n:'Gastos hormiga',g:'gus'},{n:'Deudas',g:'deu'},{n:'Vanta',g:'neg'},{n:'Pago de tarjeta',g:'x'},{n:'Otros',g:'gus'}],
    ingreso:['Sueldo','Vanta','Extra','Otros']
  },
  subs:{'Vanta':['Compras de productos','Envíos y courier','Publicidad','Cajas y empaques','Otros'], 'Envíos a Perú':['Gastos','Préstamo']},
  cuentas:[], movs:[], metas:[], fijos:[], deudas:[], tarjetas:[], prios:[], presu:{},
  rapidos:[{n:'Café', m:5},{n:'Snack', m:4},{n:'Uber', m:12}],
  ult:{}
});
let D;
function cargar() {
  try { D = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { D = null; }
  const b = DEF();
  if (!D) D = b;
  for (const k in b) if (D[k] === undefined) D[k] = b[k];
  D.cfg = {...b.cfg, ...D.cfg};
}
function guardar() {
  try { localStorage.setItem(KEY, JSON.stringify(D)); return true; }
  catch (e) { toast('No se pudo guardar: memoria llena', 'warn'); return false; }
}

/* ===================== CÁLCULOS ===================== */
const cuenta = id => D.cuentas.find(c => c.id === id);
const meta = id => D.metas.find(x => x.id === id);
const catG = nombre => (D.cats.gasto.find(c => c.n === nombre) || {g:'gus'}).g;
const aUSD = (v, mon) => mon === 'PEN' ? n(v) / (n(D.cfg.tc) || 3.75) : n(v);
function saldo(c) {
  let s = n(c.ini);
  D.movs.forEach(m => {
    if (m.t === 'in' && m.cuenta === c.id) s += n(m.monto);
    if (m.t === 'out' && m.cuenta === c.id) s -= n(m.monto);
    if (m.t === 'tr') { if (m.cuenta === c.id) s -= n(m.monto); if (m.cuenta2 === c.id) s += n(m.monto2 || m.monto); }
    if (m.t === 'ap') { const mt = meta(m.meta); if (mt && mt.cuenta !== m.cuenta) { if (m.cuenta === c.id) s -= n(m.monto); if (mt.cuenta === c.id) s += conv(m.monto, m.mon, c.mon); } }
  });
  return r2(s);
}
function avanceMeta(mt) {
  return r2(n(mt.ini) + sum(D.movs.filter(m => m.t === 'ap' && m.meta === mt.id), m => m.monto2 || m.monto) + sum(D.movs.filter(m => m.t === 'tr' && m.meta === mt.id), m => m.monto2 || m.monto));
}
function deudaActual(d) { return r2(n(d.saldo) - sum(D.movs.filter(m => m.deuda === d.id), m => m.dm != null ? m.dm : m.monto)); }
const movsMes = m => D.movs.filter(x => mesDe(x.fecha) === m);
function resumen(m) {
  const ms = movsMes(m), r = {in:{USD:0, PEN:0}, out:{USD:0, PEN:0}, inU:0, outU:0};
  ms.forEach(x => {
    if (x.t === 'in') { r.in[x.mon] += n(x.monto); r.inU += aUSD(x.monto, x.mon); }
    if (x.t === 'out') { r.out[x.mon] += n(x.monto); r.outU += aUSD(x.monto, x.mon); }
  });
  return r;
}
function pagosAnio() { return {biweekly:26, quincenal:24, mensual:12, semanal:52}[D.cfg.pago.freq] || 26; }
function ingresoPlan() { return r2(n(D.cfg.pago.monto) * pagosAnio() / 12 + n(D.cfg.otros)); }
const REGLAS = {
  '50/30/20':[['Necesidades',['nec'],50,'g'],['Gustos',['gus'],30,'g'],['Ahorro y deudas',['aho','deu'],20,'a']],
  '70/20/10':[['Gastos',['nec','gus'],70,'g'],['Ahorro',['aho'],20,'a'],['Deudas',['deu'],10,'a']],
  '70/30':[['Gastos',['nec','gus'],70,'g'],['Ahorro y deudas',['aho','deu'],30,'a']]
};
function regla() {
  const base = REGLAS[D.cfg.regla] || REGLAS['50/30/20'], p = D.cfg.pcts;
  return base.map((b, i) => [b[0], b[1], p && p[i] != null ? n(p[i]) : b[2], b[3]]);
}
function grupos(m) {
  const g = {nec:0, gus:0, deu:0, neg:0, x:0, aho:0};
  movsMes(m).forEach(x => {
    if (x.t === 'out') g[catG(x.cat)] = (g[catG(x.cat)] || 0) + aUSD(x.monto, x.mon);
    if (x.t === 'ap') g.aho += aUSD(x.monto, x.mon);
    if (x.t === 'tr') { const c2 = cuenta(x.cuenta2), c1 = cuenta(x.cuenta); if ((c2 && c2.ahorro && !(c1 && c1.ahorro)) || x.meta) g.aho += aUSD(x.monto, x.mon); }
  });
  return g;
}
function baseIngreso(m) { const r = resumen(m); return r.inU > 0 ? r.inU : ingresoPlan(); }
function estadoRegla(m) {
  const g = grupos(m), base = baseIngreso(m);
  return regla().map(([nom, ks, pct, tipo]) => { const usado = sum(ks, k => g[k] || 0), lim = base * pct / 100; return {nom, pct, tipo, usado:r2(usado), lim:r2(lim)}; });
}
function fijoPagado(f, m) { return D.movs.some(x => x.fijo === f.id && mesDe(x.fecha) === m); }
function avisos() {
  const out = [], m = mesHoy(), h = hoy();
  estadoRegla(m).forEach(e => { if (e.tipo === 'g' && e.lim > 0 && e.usado > e.lim) out.push(['bad', `Te pasaste ${M(e.usado - e.lim)} en ${e.nom} este mes.`]); });
  const g = gastoPorCat(m);
  Object.entries(D.presu).forEach(([c, lim]) => { if (n(lim) > 0 && (g[c] || 0) > n(lim)) out.push(['bad', `Presupuesto de ${c} superado: ${M(g[c])} de ${M(lim)}.`]); else if (n(lim) > 0 && (g[c] || 0) > n(lim) * 0.85) out.push(['', `Vas por el ${Math.round(g[c] / n(lim) * 100)}% del presupuesto de ${c}.`]); });
  D.fijos.forEach(f => { if (fijoPagado(f, m)) return; const fd = fechaDia(m, f.dia), d = diasEntre(h, fd); if (d < 0) out.push(['bad', `${f.n} venció el ${fcorta(fd)} y no está marcado como pagado.`]); else if (d <= 5) out.push(['', `${f.n}: pagar ${M(f.monto, f.mon)} ${d === 0 ? 'hoy' : 'en ' + d + ' día(s)'}.`]); });
  D.tarjetas.forEach(t => { if (!t.pago) return; let fd = fechaDia(m, t.pago); if (fd < h) fd = fechaDia(sumMes(m, 1), t.pago); const d = diasEntre(h, fd); if (d <= 5 && n(t.deuda) > 0) out.push(['', `Tarjeta ${t.n}: fecha de pago ${d === 0 ? 'hoy' : 'en ' + d + ' día(s)'} (${fcorta(fd)}).`]); });
  D.prios.filter(p => !p.hecho && p.limite && p.limite < h && mesDe(p.limite) <= m).forEach(p => out.push(['', `Prioridad pendiente vencida: ${p.n}.`]));
  if (D.movs.length && (!D.ultCopia || Date.now() - D.ultCopia > 7 * 86400000)) out.push(['', 'Haz una copia de seguridad: Más → Copia de seguridad.']);
  return out;
}
function gastoPorCat(m) { const g = {}; movsMes(m).filter(x => x.t === 'out').forEach(x => { g[x.cat] = (g[x.cat] || 0) + aUSD(x.monto, x.mon); }); return g; }
function hormigaMes(m) { const hs = movsMes(m).filter(x => x.t === 'out' && x.hormiga); return {total:r2(sum(hs, x => aUSD(x.monto, x.mon))), items:hs}; }
function vantaMes(m) {
  const ms = movsMes(m), i = {USD:0, PEN:0}, e = {USD:0, PEN:0};
  ms.forEach(x => { if (x.t === 'in' && x.cat === 'Vanta') i[x.mon] += n(x.monto); if (x.t === 'out' && x.cat === 'Vanta') e[x.mon] += n(x.monto); });
  return {i, e, iU:aUSD(i.USD, 'USD') + aUSD(i.PEN, 'PEN'), eU:aUSD(e.USD, 'USD') + aUSD(e.PEN, 'PEN')};
}
function recomendar() {
  const ing = ingresoPlan(), nec = sum(D.fijos.filter(f => f.g === 'nec'), f => aUSD(f.monto, f.mon)), pct = ing > 0 ? nec / ing * 100 : 0;
  let r, txt;
  if (!ing) return {pct:0, nec, ing, r:null, txt:'Escribe tu ingreso para recibir una recomendación.'};
  if (pct > 70) { r = '70/20/10'; txt = 'Tus gastos fijos necesarios son más del 70% de tu ingreso. Es muy alto: revisa cuáles puedes bajar. Mientras tanto, usa 70/20/10.'; }
  else if (pct > 50) { r = '70/20/10'; txt = 'Tus necesidades están entre el 50% y el 70% de tu ingreso. 70/20/10 es la más realista para ti sin dejar de ahorrar.'; }
  else if (pct < 40) { r = '70/30'; txt = 'Tus necesidades son menos del 40% de tu ingreso. Tienes margen para ahorrar fuerte con 70/30.'; }
  else { r = '50/30/20'; txt = 'Tus necesidades están por debajo del 50% de tu ingreso: puedes tener gustos y ahorrar bien con 50/30/20.'; }
  return {pct, nec, ing, r, txt};
}
function libreMes(m) {
  const r = resumen(m), base = r.inU > 0 ? r.inU : ingresoPlan(), pend = sum(D.fijos.filter(f => !fijoPagado(f, m)), f => aUSD(f.monto, f.mon));
  return r2(base - r.outU - pend);
}

/* ===================== UI BASE ===================== */
let TAB = 'inicio', SUB = null, MES = mesHoy(), FIL = 'todos', DIA = hoy(), PM = mesHoy(), VM = mesHoy(), F = {};
let toastT;
function toast(msg, t = 'ok') { const e = $('#toast'); e.textContent = msg; e.className = t + ' show'; clearTimeout(toastT); toastT = setTimeout(() => e.className = t, t === 'warn' ? 3500 : 1700); }
function abrir(html) { const d = document.createElement('div'); d.className = 'ov'; d.innerHTML = `<div class="sheet">${html}</div>`; d.addEventListener('click', e => { if (e.target === d) cerrar(); }); $('#modals').appendChild(d); return d; }
function cerrar() { const m = $('#modals'); if (m.lastElementChild) m.lastElementChild.remove(); }
const hayModal = () => $('#modals').children.length > 0;
const cab = t => `<div class="top"><h2>${t}</h2><button class="x" onclick="cerrar()">✕</button></div>`;
function dialogo(titulo, sub, botones) {
  const d = document.createElement('div'); d.className = 'ov ovc';
  d.innerHTML = `<div class="cbox"><p>${titulo}</p><div class="sub">${sub || ''}</div><div class="actions" style="flex-direction:column"></div></div>`;
  const a = d.querySelector('.actions');
  botones.forEach(([t, c, fn]) => { const b = document.createElement('button'); b.className = 'btn ' + (c || ''); b.textContent = t; b.onclick = () => { d.remove(); fn && fn(); }; a.appendChild(b); });
  $('#modals').appendChild(d);
}
const confirmar = (t, sub, fn, txt = 'Eliminar') => dialogo(t, sub, [[txt, 'danger', fn], ['Cancelar', 'ghost']]);
const optCuentas = (sel, mon) => D.cuentas.filter(c => !mon || c.mon === mon).map(c => `<option value="${c.id}" ${c.id === sel ? 'selected' : ''}>${esc(c.n)} (${SIM[c.mon]})</option>`).join('');
function defCuenta(mon) {
  if (mon) { const u = D.ult[mon]; if (u && cuenta(u)) return u; const c = D.cuentas.find(c => c.mon === mon); if (c) return c.id; }
  const u = D.ult.USD; if (u && cuenta(u)) return u;
  return D.cuentas[0] ? D.cuentas[0].id : '';
}
function sinCuentas() {
  if (D.cuentas.length) return false;
  dialogo('Primero crea una cuenta', 'Ej: Chase, Efectivo, Interbank. Así sabrás de dónde sale y a dónde entra tu dinero.', [['Crear cuenta', '', () => formCuenta()], ['Cancelar', 'ghost']]);
  return true;
}
const mesNav = (v, fn) => `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px"><button class="mini" onclick="${fn}(-1)">‹</button><b>${Mcap(v)}</b><button class="mini" onclick="${fn}(1)">›</button></div>`;
const ICO = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8v10h-6v-7H9v7H3z"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h1M3 12h1M3 18h1"/></svg>',

}
function addCat(t) {
  if (t === 'gasto') { const v = $('#ncG').value.trim(); if (!v || D.cats.gasto.some(c => c.n === v)) return; D.cats.gasto.push({n:v, g:$('#ngG').value}); }
  else { const v = $('#ncI').value.trim(); if (!v || D.cats.ingreso.includes(v)) return; D.cats.ingreso.push(v); }
  guardar(); render(); toast('Categoría agregada');
}
function borrarCat(t, i) { const nom = t === 'gasto' ? D.cats.gasto[i].n : D.cats.ingreso[i]; confirmar('¿Eliminar ' + nom + '?', 'Los movimientos que ya tienes con esta categoría no se borran.', () => { D.cats[t].splice(i, 1); guardar(); render(); }); }
function guardarSubs() { document.querySelectorAll('.sb').forEach(i => { const l = i.value.split(',').map(s => s.trim()).filter(Boolean); if (l.length) D.subs[i.dataset.cat] = l; else delete D.subs[i.dataset.cat]; }); guardar(); render(); toast('Guardado'); }

/* ---------- Gastos rápidos ---------- */
function sRapidos() {
  return `<div class="block"><h3>Botones de gasto rápido</h3><div class="s">Aparecen en Inicio. Un toque y se guarda como gasto hormiga (en dólares, de tu última cuenta usada).</div>
  ${D.rapidos.map((q, i) => `<div class="g2 mt" style="grid-template-columns:1fr 90px 40px"><input class="rqN" value="${esc(q.n)}"><input class="rqM" type="number" inputmode="decimal" step="0.01" value="${q.m}"><button class="mini" onclick="D.rapidos.splice(${i},1);guardar();render()">✕</button></div>`).join('')}
  <button class="btn ghost sm mt" onclick="guardarRapidos();D.rapidos.push({n:'Nuevo',m:1});guardar();render()">+ Agregar botón</button>
  <button class="btn mt" onclick="guardarRapidos();toast('Guardado')">Guardar</button></div>`;
}
function guardarRapidos() { const ns = document.querySelectorAll('.rqN'), ms = document.querySelectorAll('.rqM'); D.rapidos = [...ns].map((x, i) => ({n:x.value.trim() || 'Gasto', m:r2(ms[i].value) || 1})); guardar(); render(); }

/* ---------- Tipo de cambio ---------- */
function sTC() {
  return `<div class="block"><h3>Tipo de cambio</h3><label>1 dólar = cuántos soles</label><input id="tcV" type="number" inputmode="decimal" step="0.001" value="${D.cfg.tc}">
  <button class="btn mt" onclick="const v=n($('#tcV').value);if(v>0){D.cfg.tc=v;guardar();render();toast('Tipo de cambio guardado')}">Guardar</button>
  <div class="s mt">Se usa para convertir soles a dólares en los totales, la regla y Vanta. Cada cuenta guarda su dinero en su propia moneda.</div></div>`;
}

/* ---------- Copia de seguridad ---------- */
function sCopia() {
  return `<div class="block"><h3>Tus datos</h3><div class="s" style="font-size:14px">Todo se guarda solo en este celular. Si borras los datos de Chrome o cambias de celular, se pierde. Haz una copia cada semana.</div>
  ${row('Última copia', D.ultCopia ? fcorta(fstr(new Date(D.ultCopia))) : 'Nunca')}${row('Movimientos guardados', D.movs.length)}
  <button class="btn mt" onclick="exportar()">⬇️ Descargar copia (archivo)</button>
  <button class="btn sec mt" onclick="copiarDatos()">📋 Copiar datos como texto</button>
  <div class="s mt">Tip: guarda el archivo en Google Drive o envíatelo por WhatsApp.</div></div>
  <div class="block"><h3>Restaurar</h3><label>Desde archivo</label><input type="file" accept=".json,application/json,text/plain" onchange="leerArchivo(this)">
  <label>O pega el texto de la copia</label><textarea id="impT" placeholder="Pega aquí…"></textarea>
  <button class="btn sec mt" onclick="importar($('#impT').value)">Restaurar</button></div>
  <button class="btn danger" onclick="confirmar('¿Borrar TODOS los datos?','Esto no se puede deshacer. Descarga una copia antes.',()=>confirmar('¿Seguro?','Se borrará todo.',()=>{D=DEF();guardar();ir('inicio');toast('Datos borrados')},'Sí, borrar todo'),'Borrar todo')">Borrar todos los datos</button>`;
}
function exportar() {
  D.ultCopia = Date.now(); guardar();
  const b = new Blob([JSON.stringify(D)], {type:'application/json'}), a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = 'mis-finanzas-' + hoy() + '.json'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000); render(); toast('Copia descargada');
}
function copiarDatos() {
  const t = JSON.stringify(D);
  const ok = () => { D.ultCopia = Date.now(); guardar(); render(); toast('Copiado. Pégalo en WhatsApp o notas'); };
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(ok, () => { $('#impT').value = t; toast('Selecciona y copia el texto', 'warn'); });
  else { $('#impT').value = t; toast('Selecciona y copia el texto', 'warn'); }
}
function leerArchivo(inp) { const f = inp.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => importar(r.result); r.readAsText(f); }
function importar(txt) {
  let d; try { d = JSON.parse(txt); } catch (e) { return toast('El texto no es una copia válida', 'warn'); }
  if (!d || !Array.isArray(d.movs) || !Array.isArray(d.cuentas)) return toast('El texto no es una copia válida', 'warn');
  confirmar('¿Restaurar copia?', `Tiene ${d.movs.length} movimientos y ${d.cuentas.length} cuentas. Reemplaza lo que hay ahora.`, () => {
    localStorage.setItem(KEY, JSON.stringify(d)); cargar(); guardar(); ir('inicio'); toast('Copia restaurada');
  }, 'Restaurar');
}

/* ===================== BOTÓN ATRÁS E INICIO ===================== */
let salirT = 0;
window.addEventListener('popstate', () => {
  if (hayModal()) cerrar();
  else if (TAB === 'mas' && SUB) { SUB = null; render(); }
  else if (TAB !== 'inicio') ir('inicio');
  else if (Date.now() - salirT > 2000) { salirT = Date.now(); toast('Presiona atrás otra vez para salir'); }
  else { history.back(); return; }
  history.pushState({g:1}, '');
});
cargar();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
history.replaceState({r:1}, ''); history.pushState({g:1}, '');
render();
</script>
</body>
</html>
